services:
  mongo:
    image: mongo:7
    container_name: pct-mongo-prod
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./capstone-api
    container_name: pct-api-prod
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy_claims_tracker
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      CLIENT_ORIGIN: https://localhost:8443
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  client:
    build:
      context: ./capstone-client
    container_name: pct-client-prod
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./capstone-client/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  mongo_data_prod:

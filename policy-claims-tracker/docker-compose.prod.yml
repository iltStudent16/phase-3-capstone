services:
  mongo:
    image: mongo:7
    container_name: pct-mongo-prod
    volumes:
      - mongo_data_prod:/data/db

  api:
    build:
      context: ./capstone-api
    container_name: pct-api-prod
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy_claims_tracker
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      CLIENT_ORIGIN: https://localhost:8443
    depends_on:
      - mongo

  client:
    build:
      context: ./capstone-client
    container_name: pct-client-prod
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./capstone-client/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo_data_prod:
